authors = ["Glitch"]
description = "Fastly in Glitch"
language = "javascript"
manifest_version = 2
service_id = ""
name = "SueSmith-a-static-site"

[scripts]
  build = "npm run build"

[setup.backends."github"] 
  address = "SueSmith.github.io"
  description = "GitHub backend"
  port = 443

[local_server]
  [local_server.backends]
    [local_server.backends.github]
      url = "http://127.0.0.1:3000"